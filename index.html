    function polishTextWithDiff(rawText) {
      if (!rawText) return { polished: '', changes: [] };
      let polished = rawText;
      const changes = [];
      TYPO_DICTIONARY.forEach(({ wrong, right }) => {
        if (polished.includes(wrong) && wrong !== right) {
          polished = polished.split(wrong).join(right);
          changes.push({ from: wrong, to: right });
        }
      });
      return { polished, changes };

    async function extractTextFromPdf(file) {
      if (!window.pdfjsLib) throw new Error('pdf.js 尚未載入，請確認網路連線後重新整理頁面');
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER_SRC;
      const data = new Uint8Array(await file.arrayBuffer());
      const pdf = await window.pdfjsLib.getDocument({ data }).promise;
      const pages = [];
      for (let p = 1; p <= pdf.numPages; p++) {
        const page = await pdf.getPage(p);
        const content = await page.getTextContent();
        const lines = [];
        let line = '';
        let lastY = null;
        content.items.forEach((item) => {
          if (!('str' in item)) return;
          const y = item.transform[5];
          if (lastY !== null && Math.abs(y - lastY) > 2) {
            lines.push(line);
            line = '';
          }
          line += item.str;
          lastY = y;
          if (item.hasEOL) {
            lines.push(line);
            line = '';
            lastY = null;
          }
        });
        if (line) lines.push(line);
        pages.push(lines.map((l) => l.replace(/\s+$/, '')).filter((l) => l.trim()).join('\n'));
      }
      return pages.join('\n\n').trim();
    }

    async function callClaudeJson({ apiKey, model, system, user, maxTokens = 2000 }) {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model,
          max_tokens: maxTokens,
          system,
          messages: [{ role: 'user', content: user }]
        })
      });
      if (!res.ok) {
        let detail = '';
        try {
          const errBody = await res.json();
          detail = errBody?.error?.message || '';
        } catch {}
        const hint =
          res.status === 401 ? 'API Key 無效或已被撤銷' :
          res.status === 403 ? 'API Key 沒有使用權限' :
          res.status === 404 ? '找不到此模型，請在設定中改選其他模型' :
          res.status === 429 ? '請求過於頻繁或額度不足' :
          `HTTP ${res.status}`;
        throw new Error(detail ? `${hint}：${detail}` : hint);
      }
      const data = await res.json();
      const text = (data.content || []).filter((b) => b.type === 'text').map((b) => b.text).join('');
      const cleaned = text.replace(/```json|```/g, '').trim();
      const start = cleaned.indexOf('{');
      const end = cleaned.lastIndexOf('}');
      if (start < 0 || end < 0) throw new Error('AI 回傳格式無法解析，請重試');
      try {
        return JSON.parse(cleaned.slice(start, end + 1));
      } catch {
        throw new Error('AI 回傳內容不完整，請重試');
      }
    }

        const clamp = (v, fb) => {
          const n = Number(v);

        };
        const cleanList = (v, fb, max) => {

        };
        const ts = Date.now();

        const extractedName =

        const scores = {

        let drafts = items.map((it) => {
          const { polished, changes } = polishTextWithDiff(it.raw);
          return { ...it, polished, changes, accepted: true };

        let aiError = '';
        let rejectedCount = 0;
        if (aiReady && drafts.length) {

          try {
            const result = await callClaudeJson({

              maxTokens: 4000,
              system: POLISH_SYSTEM_PROMPT,
              user: JSON.stringify({ items: items.map((it) => ({ key: it.key, text: it.raw })) })

            const byKey = {};
            (Array.isArray(result.items) ? result.items : []).forEach((r) => {
              if (r && r.key) byKey[r.key] = r;
            });
            drafts = drafts.map((d) => {

                    .map((c) => ({ from: String(c.from), to: String(c.to) }))
                : [];
              return { ...d, polished, changes };
            });

                            <label className="block text-xs font-bold mb-1">該份工作的 HR 詢問紀錄：</label>
                            <textarea
                              rows={2}
                              value={wh.hrNotes}
                              onChange={(e) => {
                                const val = e.target.value;
                                updateActiveCandidate((c) => ({
                                  ...c,
                                  workHistory: c.workHistory.map((item) => (item.id === wh.id ? { ...item, hrNotes: val } : item))
                                }));
                              }}
                              className="w-full text-sm bg-white border-2 border-[#A7C7E4] rounded-xl p-2.5"
                            />
                          </div>
                        </div>
                      ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 互動彈窗：長條圖 */}
          {showChartModal && (
            <div className="fixed inset-0 z-50 bg-[#2D4720]/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl border-2 border-[#A7C7E4]">
                <div className="flex items-center justify-between pb-4 border-b border-[#A7C7E4]">
                  <h3 className="text-base font-extrabold text-[#2D4720]">各職缺已建檔面談／評估人數分佈長條圖</h3>
                  <button onClick={() => setShowChartModal(false)}>
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>
                <div className="py-6 space-y-5 max-h-[60vh] overflow-y-auto">
                  {barChartData.map((item) => (
                    <div key={item.id} className="space-y-2">
                      <div className="flex justify-between text-xs font-bold">
                        <span>{item.title}（{item.status}）</span>
                        <span className="text-[#5D7B3D]">{item.count} 人（需求 {item.headcount} 位）</span>
                      </div>
                      <div className="w-full bg-[#5D7B3D]/10 h-7 rounded-xl overflow-hidden p-1 border border-[#A7C7E4]">
                        <div
                          className="h-full rounded-lg bg-gradient-to-r from-[#5D7B3D] to-[#E4568B] flex items-center justify-end pr-2.5 text-[11px] font-bold text-white"
                          style={{ width: `${Math.max(item.percentage, item.count > 0 ? 12 : 0)}%` }}
                        >
                          {item.count > 0 && item.count}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
                <div className="pt-4 border-t border-[#A7C7E4] flex justify-end">
                  <button onClick={() => setShowChartModal(false)} className="bg-[#5D7B3D] text-white px-5 py-2 rounded-xl text-xs font-bold">
                    關閉統計視窗
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 互動彈窗：刪除警語確認 */}
          {deleteWarningTarget && (
            <div className="fixed inset-0 z-50 bg-[#2D4720]/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border-2 border-[#E4568B]">
                <h3 className="text-base font-extrabold text-[#E4568B] flex items-center gap-2">
                  <Icon name="alert" className="w-5 h-5" />
                  {deleteWarningTarget.isPermanent ? '警告：確定要永久清除此職缺嗎？' : '警語：確定要刪除此招募職缺嗎？'}
                </h3>
                <p className="text-xs text-[#2D4720] mt-3 leading-relaxed">
                  您即將操作職缺：<strong>「{deleteWarningTarget.title}」</strong>。確認刪除後，此職缺將歸類至儀表板首頁下方的「已刪除 / 已封存職缺歸類區」。
                </p>
                <div className="mt-6 flex justify-end gap-2.5">
                  <button onClick={() => setDeleteWarningTarget(null)} className="px-4 py-2 rounded-xl text-xs font-bold">
                    取消返回
                  </button>
                  <button onClick={confirmDeleteAction} className="bg-[#E4568B] text-white px-4 py-2 rounded-xl text-xs font-bold">
                    確認刪除
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 互動彈窗：雙軌錯字校對 */}
          {showDiffModal && (
            <div className="fixed inset-0 z-50 bg-[#2D4720]/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-4xl w-full max-h-[90vh] flex flex-col shadow-2xl border-2 border-[#A7C7E4] overflow-hidden">
                <div className="px-6 py-4 bg-[#5D7B3D] text-white flex items-center justify-between">
                  <h3 className="text-base font-bold">雙軌筆記保留與 AI 錯字校對確認（左側原始筆記永久保留）</h3>
                  <button onClick={() => setShowDiffModal(false)}>
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>
                <div className="p-6 overflow-y-auto flex-1 space-y-4 bg-[#5D7B3D]/10">
                  {diffDrafts.map((item, idx) => (
                    <div key={item.key} className="bg-white rounded-2xl border-2 border-[#A7C7E4] p-4">
                      <div className="text-xs font-extrabold mb-2">{item.label}</div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                        <div className="bg-[#5D7B3D]/10 border border-[#A7C7E4] rounded-xl p-3">
                          <strong className="block mb-1">【原始逐字筆記（永久保留不覆蓋）】</strong>
                          {item.raw}
                        </div>
                        <div className="bg-[#A7C7E4]/25 border border-[#A7C7E4] rounded-xl p-3">
                          <strong className="block mb-1">【AI 校對潤飾版】</strong>
                          <textarea
                            rows={2}
                            value={item.polished}
                            onChange={(e) => {
                              const val = e.target.value;
                              setDiffDrafts((prev) => prev.map((d, i) => (i === idx ? { ...d, polished: val } : d)));
                            }}
                            className="w-full bg-white border border-[#A7C7E4] rounded-lg p-2"
                          />
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
                <div className="px-6 py-4 bg-white border-t border-[#A7C7E4] flex justify-end gap-3">
                  <button onClick={() => setShowDiffModal(false)} className="px-4 py-2 rounded-xl text-xs font-bold">
                    返回
                  </button>
                  <button onClick={handleConfirmPolishedNotes} className="bg-[#E4568B] text-white px-5 py-2.5 rounded-xl text-xs font-bold">
                    確認無誤，產出主管評估報告
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 互動彈窗：主管評估報告 */}
          {showReportModal && activeCand && activeJd && (
            <div className="fixed inset-0 z-50 bg-[#2D4720]/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-4xl w-full max-h-[92vh] flex flex-col shadow-2xl border-2 border-[#A7C7E4] overflow-hidden">
                <div className="px-6 py-4 bg-[#5D7B3D] text-white flex items-center justify-between">
                  <h3 className="text-base font-bold">用人主管專屬：HR 面談結構化評估報告</h3>
                  <div className="flex items-center gap-2">
                    <button onClick={handleCopyReportText} className="bg-[#E4568B] text-white px-3.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1">
                      <Icon name="copy" className="w-3.5 h-3.5" />
                      一鍵複製純文字
                    </button>
                    <button onClick={() => window.print()} className="bg-[#A7C7E4] text-[#2D4720] px-3.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1">
                      <Icon name="printer" className="w-3.5 h-3.5" />
                      列印 / 存 PDF
                    </button>
                    <button onClick={() => setShowReportModal(false)} className="ml-2">
                      <Icon name="x" className="w-5 h-5" />
                    </button>
                  </div>
                </div>
                <div id="printable-report-area" className="p-8 overflow-y-auto flex-1 space-y-6 bg-white">
                  <div className="border-b-2 border-[#5D7B3D] pb-4">
                    <span className="text-xs font-bold text-[#E4568B]">CONFIDENTIAL · HRBP INTERVIEW ASSESSMENT</span>
                    <h2 className="text-2xl font-extrabold mt-1">{activeCand.name} — 面談評估報告</h2>
                    <p className="text-sm mt-1">應徵職缺：{activeJd.title} ｜ 面談日期：{activeCand.interviewDate}</p>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-[#5D7B3D]/10 p-4 rounded-2xl border-2 border-[#A7C7E4] text-xs">
                    <div>
                      <span className="block opacity-70">最快可到職日</span>
                      <strong className="text-sm text-[#5D7B3D]">{activeCand.coreInfo.earliestStartDate || '待確認'}</strong>
                    </div>
                    <div>
                      <span className="block opacity-70">管理經驗與幅度</span>
                      <strong className="text-sm">
                        {activeCand.coreInfo.hasManagementExp
                          ? `有（${activeCand.coreInfo.managementHeadcount}｜${activeCand.coreInfo.managementRoles}）`
                          : '無直接管理經驗'}
                      </strong>
                    </div>
                    <div>
                      <span className="block opacity-70">期待薪資區間</span>
                      <strong className="text-sm">{activeCand.coreInfo.expectedSalary || '面議'}</strong>
                    </div>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                    <div className="border-2 border-[#A7C7E4] rounded-xl p-4">
                      <h4 className="font-extrabold text-sm mb-1">1. 工作適配性（深度 & 廣度）</h4>
                      <p>硬實力匹配度達 <strong className="text-[#E4568B]">{activeCand.scores.hardSkills} 分</strong>。{activeCand.pros[0]}。</p>
                    </div>
                    <div className="border-2 border-[#A7C7E4] rounded-xl p-4">
                      <h4 className="font-extrabold text-sm mb-1">2. 創新思維與主動優化</h4>
                      <p>過往經歷中展現主動優化作業流程與導入數據追蹤工具的意識。</p>
                    </div>
                    <div className="border-2 border-[#A7C7E4] rounded-xl p-4">
                      <h4 className="font-extrabold text-sm mb-1">3. 問題解決能力（Problem Solving）</h4>
                      <p>面對組織變動或專案卡點時，能先以客觀數據拆解根因並提出務實解方。</p>
                    </div>
                    <div className="border-2 border-[#A7C7E4] rounded-xl p-4">
                      <h4 className="font-extrabold text-sm mb-1">4. 跨部門溝通與影響力</h4>
                      <p>懂得站在業務與技術主管痛點角度對話，具備非職權跨部門協調落地能力。</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 互動彈窗：新增職缺 */}
          {showNewJdModal && (
            <div className="fixed inset-0 z-50 bg-[#2D4720]/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border-2 border-[#A7C7E4]">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-lg font-extrabold">新增招募職缺 (Position)</h3>
                  <button onClick={() => setShowNewJdModal(false)}>
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>
                <form onSubmit={handleCreateJd} className="space-y-4">
                  <div className="grid grid-cols-3 gap-3">
                    <div className="col-span-2">
                      <label className="block text-xs font-bold mb-1">職缺名稱 *</label>
                      <input
                        type="text"
                        required
                        value={newJdForm.title}
                        onChange={(e) => setNewJdForm({ ...newJdForm, title: e.target.value })}
                        className="w-full text-sm border-2 border-[#A7C7E4] rounded-xl px-3 py-2"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold mb-1">職缺數量 *</label>
                      <input
                        type="number"
                        min={1}
                        required
                        value={newJdForm.headcount}
                        onChange={(e) => setNewJdForm({ ...newJdForm, headcount: parseInt(e.target.value, 10) || 1 })}
                        className="w-full text-sm border-2 border-[#A7C7E4] rounded-xl px-3 py-2"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-bold mb-1">用人部門</label>
                    <input
                      type="text"
                      value={newJdForm.department}
                      onChange={(e) => setNewJdForm({ ...newJdForm, department: e.target.value })}
                      className="w-full text-sm border-2 border-[#A7C7E4] rounded-xl px-3 py-2"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold mb-1">JD 條件與職責（首頁不顯示，僅作為篩選依據）</label>
                    <textarea
                      rows={4}
                      value={newJdForm.description}
                      onChange={(e) => setNewJdForm({ ...newJdForm, description: e.target.value })}
                      className="w-full text-sm border-2 border-[#A7C7E4] rounded-xl p-3"
                    />
                  </div>
                  <div className="flex justify-end gap-2">
                    <button type="button" onClick={() => setShowNewJdModal(false)} className="px-4 py-2 text-xs font-bold">
                      取消
                    </button>
                    <button type="submit" className="bg-[#E4568B] text-white px-5 py-2 rounded-xl text-xs font-bold">
                      建立職缺
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 互動彈窗：資安與 API Key 設定 */}
          {showSettingsModal && (
            <div className="fixed inset-0 z-50 bg-[#2D4720]/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full max-h-[90vh] overflow-y-auto p-6 shadow-2xl border-2 border-[#A7C7E4] space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-extrabold">本地資安與 AI 引擎設定</h3>
                  <button onClick={() => setShowSettingsModal(false)}>
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>
                <div className="bg-[#5D7B3D]/10 border-2 border-[#A7C7E4] rounded-xl p-3 text-xs leading-relaxed">
                  <strong>Zero-Leak 資安架構：</strong> 所有資料與 API Key 皆僅存於您的瀏覽器 LocalStorage，不經過任何中介伺服器；PDF 文字擷取也全程在本機完成。
                  <br />
                  <strong>啟用 Claude AI 後：</strong> 履歷（電話與 Email 已先遮罩）與面談筆記，會由您的瀏覽器直接傳送至 Anthropic API 處理。
                </div>
                <div>
                  <label className="block text-xs font-bold mb-1">畫面隱私鎖定 PIN 碼（4~6 碼）</label>
                  <input
                    type="text"
                    maxLength={6}
                    value={db.pinCode}
                    onChange={(e) => setDb((prev) => ({ ...prev, pinCode: e.target.value }))}
                    className="w-full text-sm border-2 border-[#A7C7E4] rounded-xl px-3 py-2"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold mb-1">Claude API Key（僅存於本機）</label>
                  <div className="flex gap-2">
                    <input
                      type={showApiKey ? 'text' : 'password'}
                      value={db.apiKey}
                      autoComplete="off"
                      onChange={(e) => setDb((prev) => ({ ...prev, apiKey: e.target.value }))}
                      placeholder="sk-ant-..."
                      className="flex-1 min-w-0 text-sm border-2 border-[#A7C7E4] rounded-xl px-3 py-2"
                    />
                    <button
                      type="button"
                      onClick={() => setShowApiKey((v) => !v)}
                      className="px-3 rounded-xl text-xs font-bold border-2 border-[#A7C7E4] text-[#2D4720] hover:bg-[#A7C7E4]/30"
                    >
                      {showApiKey ? '隱藏' : '顯示'}
                    </button>
                  </div>
                  <p className="mt-1 text-[11px] text-[#3B5228] leading-relaxed">
                    Key 以明文存於此瀏覽器的 LocalStorage，請勿在共用電腦使用。建議到 Anthropic Console 建立專用 Key 並設定用量上限。
                  </p>
                </div>
                <div>
                  <label className="block text-xs font-bold mb-1">AI 模型</label>
                  <select
                    value={db.aiModel || DEFAULT_CLAUDE_MODEL}
                    onChange={(e) => setDb((prev) => ({ ...prev, aiModel: e.target.value }))}
                    className="w-full text-sm border-2 border-[#A7C7E4] rounded-xl px-3 py-2 bg-white"
                  >
                    {CLAUDE_MODELS.map((m) => (
                      <option key={m.id} value={m.id}>
                        {m.label}
                      </option>
                    ))}
                  </select>
                </div>
                <label className="flex items-start gap-2 text-xs bg-[#F6C94D]/20 border-2 border-[#F6C94D] rounded-xl p-3 cursor-pointer">
                  <input
                    type="checkbox"
                    checked={Boolean(db.aiConsent)}
                    onChange={(e) => setDb((prev) => ({ ...prev, aiConsent: e.target.checked }))}
                    className="mt-0.5"
                  />
                  <span>
                    我了解啟用後，人選履歷與面談筆記（可能含薪資等個資）會傳送至 Anthropic 處理，並已確認符合公司與人選的個資同意規範。未勾選時，系統只使用本機基礎分析。
                  </span>
                </label>
                <div className="flex items-center justify-between gap-2">
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={handleTestApiKey}
                      disabled={isTestingKey}
                      className="px-3 py-2 rounded-xl text-xs font-bold border-2 border-[#5D7B3D] text-[#2D4720] hover:bg-[#5D7B3D]/10 disabled:opacity-60"
                    >
                      {isTestingKey ? '測試中...' : '測試連線'}
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        setDb((prev) => ({ ...prev, apiKey: '' }));
                        triggerToast('已清除本機儲存的 API Key');
                      }}
                      className="px-3 py-2 rounded-xl text-xs font-bold border-2 border-[#A7C7E4] text-[#2D4720] hover:bg-[#A7C7E4]/30"
                    >
                      清除 Key
                    </button>
                  </div>
                  <button
                    onClick={() => {
                      setShowSettingsModal(false);
                      triggerToast('本地資安與系統設定已儲存');
                    }}
                    className="bg-[#E4568B] text-white px-5 py-2 rounded-xl text-xs font-bold"
                  >
                    儲存設定
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
